# Dependabot: weekly pull requests that update the GitHub Actions the workflows use, the NuGet
# packages of the .NET projects that build and test the exporter (unity/dotnet), and the two Python
# packages of the tools (tools/requirements.txt). Each PR runs CI.
#
# The actions are pinned to commit hashes with the version in a comment
# (uses: actions/checkout@<sha> # v7.0.1); Dependabot updates both. The NuGet packages are pinned by
# the packages.lock.json files and the Python packages by the hashes in tools/requirements.txt;
# Dependabot updates those too.
# The Unity package and the mod themselves have no dependencies: none of this is in a release.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    # one PR for all the actions that have an update the same week
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    # numpy and Pillow, for the Python tools and their tests
    directory: "/tools"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      python-tools:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    # every project with packages; Core and PackHarness have none of their own
    directories:
      - "/unity/dotnet/Core.Tests"
      - "/unity/dotnet/EditorTypeCheck"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    groups:
      # the test framework's packages together, minor and patch updates only
      test-framework:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "NUnit*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # NUnit 4 drops the classic asserts (StringAssert, ...) the tests use: a move to it is done by hand
      - dependency-name: "NUnit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "NUnit3TestAdapter"
        update-types: ["version-update:semver-major"]
      # Unity's API that EditorTypeCheck compiles the Editor scripts against; it follows the Unity
      # version the exporter supports (2022.3), not the newest package
      - dependency-name: "Unity3D.SDK"
