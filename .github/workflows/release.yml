# Publishes one GitHub release with both downloads: the Unity exporter (.unitypackage) and the
# VRC Avatars mod (zip). The release is named after the exporter's version.
#
# Runs by itself after CI passes on main, so bumping a version is all a release takes:
# - a new exporter version (package.json) publishes a new release with both files;
# - a new mod version (vrc-avatars/info.json) alone swaps the new mod zip into the current
#   release;
# - nothing new does nothing.
# It is a full release marked latest, so the repository's front page shows it. Older releases and their
# tags are kept.
#
# Otherwise either push a tag exporter-v<version> matching package.json, or run this workflow by hand
# from the Actions tab ("Run workflow").
#
# Three jobs, so that nothing downloaded from elsewhere ever runs with the right to change a release:
# - test runs the Core tests (the only step that fetches packages, from NuGet), read-only;
# - build makes the two files with Python's standard library alone, read-only;
# - publish gets those two files and is the only job that may write. It checks out no code and runs
#   nothing but gh. It never replaces a file a release already has, lists the SHA-256 of both files in
#   the release notes, and signs a build provenance attestation for each file it uploads
#   (SECURITY.md says how to check a download against it).
name: Release

on:
  push:
    tags:
      - "exporter-v*"
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# each job asks for what it needs
permissions: {}

# one at a time: two runs must not edit the same release at once
concurrency:
  group: release
  cancel-in-progress: false

env:
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  test:
    name: Test the exporter Core
    # after CI, only when it passed on a push to main
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Test the exporter Core
        run: dotnet test unity/dotnet/Core.Tests

  build:
    name: Build the two files
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exporter: ${{ steps.version.outputs.exporter }}
      mod: ${{ steps.version.outputs.mod }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false

      - name: Work out the versions
        id: version
        run: |
          exporter=$(python3 -c "import json; print(json.load(open('unity/Packages/com.vrcavatars.factorio-avatar-exporter/package.json'))['version'])")
          mod=$(python3 -c "import json; print(json.load(open('vrc-avatars/info.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#exporter-v}" != "$exporter" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $exporter"
            exit 1
          fi
          # the versions end up in file names and the release's tag: digits and dots only
          for version in "$exporter" "$mod"; do
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "\"$version\" is not a version like 1.0.0"
              exit 1
            fi
          done
          echo "tag=exporter-v$exporter" >> "$GITHUB_OUTPUT"
          echo "exporter=$exporter" >> "$GITHUB_OUTPUT"
          echo "mod=$mod" >> "$GITHUB_OUTPUT"

      # Python's standard library only: no package is installed in this job
      - name: Build the .unitypackage and the mod zip
        run: |
          python3 tools/make_unitypackage.py
          tools/build_mod.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            build/FactorioAvatarExporter_${{ steps.version.outputs.exporter }}.unitypackage
            build/vrc-avatars_${{ steps.version.outputs.mod }}.zip
          if-no-files-found: error

  publish:
    name: Publish
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # the release
      id-token: write      # signing the attestations
      attestations: write  # storing them
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: build

      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          EXPORTER: ${{ needs.build.outputs.exporter }}
          MOD: ${{ needs.build.outputs.mod }}
        run: |
          package="build/FactorioAvatarExporter_$EXPORTER.unitypackage"
          zip="build/vrc-avatars_$MOD.zip"
          [ -f "$package" ] && [ -f "$zip" ] || { echo "The build job's files are missing"; exit 1; }
          cat > notes.md <<NOTES
          ### Which file do I need?

          | File | Who needs it |
          | --- | --- |
          | **$(basename "$zip")** | **Every player.** The Factorio mod: drop it, still zipped, into Factorio's \`mods\` folder together with the avatar packs (on a server, every player's). |
          | **$(basename "$package")** | **Only whoever makes an avatar pack**, in Unity. |

          The **Source code** links under them are added to every release by GitHub. Players don't need them.

          **Installing the mod (VRC Avatars $MOD):** Factorio's \`mods\` folder is
          \`%APPDATA%\\Factorio\\mods\` on Windows, \`~/.factorio/mods\` on Linux and
          \`~/Library/Application Support/factorio/mods\` on macOS. Factorio 2.1; Space Age is optional. In
          multiplayer, everyone needs the same mods and packs as the server, from whoever runs it: the game's
          **Synchronize** button can't fetch them, since they aren't on the mod portal. Before removing a pack or the mod
          from a save, an admin runs \`/avatar-revert-all\` (see the README).

          **Installing the exporter:** in Unity 2022.3 (your VRChat project) choose **Assets ▸ Import Package ▸
          Custom Package...**, pick the file and click **Import**. It is installed in
          \`Assets/FactorioAvatarExporter\`. Then open **Tools ▸ Factorio Avatar Exporter**.

          **Updating the exporter:** first delete the \`Core\` and \`Editor\` folders inside
          \`Assets/FactorioAvatarExporter\` in Unity's Project window, then import the new file. Importing over
          an older version can leave its old scripts in place (with 0.30.0 and older this shows as compile errors).
          If Unity offers Safe Mode because of compile errors, choose **Ignore**, then delete the folders and import.
          NOTES
          title="Factorio Avatar Exporter $EXPORTER (mod $MOD)"
          # the files this run adds to the release, for the attestation step
          mkdir uploaded
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" "$package" "$zip" --target "$COMMIT" --title "$title" \
              --notes-file notes.md --latest
            cp "$package" "$zip" uploaded/
          else
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            for file in "$package" "$zip"; do
              # a file the release already has is never replaced: bump the version to publish a new one
              if ! grep -qxF "$(basename "$file")" <<< "$assets"; then
                gh release upload "$TAG" "$file"
                cp "$file" uploaded/
                echo "added $(basename "$file") to $TAG"
              fi
            done
            # the mod zip of an older mod version
            for old in $(grep -x 'vrc-avatars_.*\.zip' <<< "$assets" | grep -vxF "$(basename "$zip")"); do
              gh release delete-asset "$TAG" "$old" --yes
              echo "removed $old from $TAG"
            done
          fi
          # the checksums of the two files as the release now holds them (downloaded back, so they are
          # right also for a file an earlier run uploaded)
          mkdir published
          gh release download "$TAG" --dir published \
            --pattern "$(basename "$package")" --pattern "$(basename "$zip")"
          {
            echo
            echo "### Checksums (SHA-256)"
            echo
            echo "To make sure a file you were sent is the one published here, compare its SHA-256"
            echo "(Windows PowerShell: \`Get-FileHash <file>\`; macOS: \`shasum -a 256 <file>\`; Linux: \`sha256sum <file>\`)."
            echo
            echo '```'
            (cd published && sha256sum -- *)
            echo '```'
          } >> notes.md
          # the notes and title follow this workflow's wording and the current mod version; a full release
          # marked latest, so the repository's front page shows it (it shows no pre-releases, only their tags)
          gh release edit "$TAG" --title "$title" --notes-file notes.md --prerelease=false --latest
          if [ -n "$(ls uploaded)" ]; then
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG already has both files; bump a version to publish a new one."
          fi

      # a signed statement that these exact files were built by this workflow in this repository;
      # anyone can check a download against it with gh attestation verify (SECURITY.md)
      - name: Attest the uploaded files
        if: steps.publish.outputs.uploaded == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: uploaded/*
