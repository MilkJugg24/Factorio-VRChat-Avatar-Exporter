[mod-name]
vrc-avatars=VRC Avatars

[mod-description]
vrc-avatars=Lets every player pick their own look from the installed avatar packs: your VRChat or other humanoid avatar, turned into a pack with the Factorio Avatar Exporter for Unity. Open the avatar window from the shortcut bar, the button in the top-left corner or with Ctrl + Shift + A. Without packs, everyone stays the engineer.

[shortcut-name]
vrc-avatars-choose=Choose your avatar

[controls]
vrc-avatars-toggle-gui=Open the avatar window

[mod-setting-name]
vrc-avatars-show-top-button=Show the avatar button in the top-left corner
vrc-avatars-sprint-bonus=Sprint from this armor speed bonus (%)
vrc-avatars-armor-flight=Every armor flies (wings, Space Age)

[mod-setting-description]
vrc-avatars-show-top-button=Adds a button next to the other mod buttons that opens the avatar window, for every player. The window can also be opened from the shortcut bar or with Ctrl + Shift + A.
vrc-avatars-sprint-bonus=When the exoskeletons in a player's armor make them this much faster (each one adds 30 %), their avatar sprints instead of jogging. 0 turns sprinting off. Avatar packs exported before Factorio Avatar Exporter 0.21.0 always jog.
vrc-avatars-armor-flight=Every armor lets its wearer fly over buildings, cliffs and water, like Space Age's mech armor, so winged avatars can take to the air. Flying armor gets a small feather on its icon. Players without armor still walk. Needs Space Age (without it, Factorio allows no flying armor). Everyone on a server has the same setting.

